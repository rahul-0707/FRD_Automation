name: Playwright Cloud Tests 🚀

on:
  push:
    branches: [ main, master ]

jobs:
  automation-test:
    runs-on: ubuntu-latest

    steps:
    - name: Get Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'

    - name: Install Library and Engine
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Browsers
      run: playwright install --with-deps

      # 1. YAHAN CHANGE KIYA: --html=report.html add kiya hai
    - name: Run the Tests
      env:
        BASE_URL: https://www.saucedemo.com/
      run: pytest test_day11.py --browser chromium -n 3 --html=report.html --self-contained-html
      # 2. NAYA STEP: Report ko GitHub par upload karne ke liye
    - name: Upload HTML Report
      if: always() 
      uses: actions/upload-artifact@v4
      with:
        name: playwright-html-report
        path: report.html

    # Naya Notification Step
    - name: Send Telegram Notification
      if: always() 
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_TO }}
        token: ${{ secrets.TELEGRAM_TOKEN }}
        message: |
          🚀 *Playwright Cloud Test Report*
          ------------------------------
          Status: ${{ job.status == 'success' && '✅ PASSED' || '❌ FAILED' }}
          Project: ${{ github.repository }}
          Run ID: ${{ github.run_id }}
          Check full report here: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
